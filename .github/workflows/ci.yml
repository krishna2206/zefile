name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          check-latest: true

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: CGO_ENABLED=0 go build -trimpath ./...

      - name: Test
        run: go test -race ./...

  vuln:
    name: Vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          check-latest: true
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  gosec:
    name: Static security analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: securego/gosec@master
        with:
          # Generated code is excluded rather than annotated: it cannot carry
          # a #nosec comment that survives regeneration, and sqlc's query
          # constants trip the hardcoded-credentials rule on any string
          # containing "token_hash". Narrowing to the directory keeps the rule
          # active everywhere it can actually find something.
          # G703 (taint-analysis path traversal) is excluded: it fires on the
          # backup/restore paths a human operator passes on the command line, by
          # design, and cannot know they are trusted. Real path safety lives in
          # the storage layer (os.Root), which those commands do not touch.
          args: -exclude-dir=internal/db/sqlcgen -exclude=G703 ./...

  generated:
    name: Generated code is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          check-latest: true
      # Contributors never need sqlc: the generated code is committed, so a
      # clone plus `go build` is enough. This job is what keeps that promise
      # honest — a query edited without regenerating fails here.
      - name: Regenerate
        run: go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate
      - name: Check for drift
        run: |
          if ! git diff --exit-code; then
            echo "Generated code is out of date. Run: make generate"
            exit 1
          fi

  web:
    name: Interface
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Type-check
        run: pnpm run typecheck
      - name: Build
        run: pnpm run build

  image:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Built but not pushed. The point is that the Dockerfile keeps working —
      # a broken one discovered at release time is discovered too late.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: zefile:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image
        run: |
          set -eu
          mkdir -p /tmp/data
          docker run -d --name zefile \
            -e ZEFILE_APP_URL=http://localhost:8080 \
            -v /tmp/data:/data \
            -p 8080:8080 zefile:ci

          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/healthz >/dev/null 2>&1; then
              echo "healthy after ${i}s"
              break
            fi
            if [ "$i" = "30" ]; then
              echo "never became healthy"; docker logs zefile; exit 1
            fi
            sleep 1
          done

          # An instance with no account must announce a setup link rather than
          # create a default administrator.
          docker logs zefile 2>&1 | grep -q "no account yet" \
            || { echo "no setup link was announced"; docker logs zefile; exit 1; }

          # And it must not be reachable without signing in.
          code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api/v1/fs)
          [ "$code" = "401" ] || { echo "unauthenticated listing returned $code"; exit 1; }

          docker rm -f zefile
