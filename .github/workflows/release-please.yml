name: release-please

# Reads the Conventional Commits merged into main, works out the next version
# (feat -> minor, fix -> patch, ! / BREAKING CHANGE -> minor while under 1.0),
# and keeps a "release PR" open with the pending version and changelog. Merging
# that PR tags the version and cuts the GitHub release.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Publish the image and binaries in the SAME run that cut the release. This is
  # the fix for the token trap: a tag pushed by release-please never triggers a
  # tag-listening workflow, but this job runs on the push-to-main that merged the
  # release PR, so it fires reliably.
  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    permissions:
      contents: write
      packages: write
    secrets: inherit
