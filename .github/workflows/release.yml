name: Release

# Publishes the container image and the binaries for a tag.
#
# It never triggers on a pushed tag: release-please creates tags with the
# GITHUB_TOKEN, and GitHub deliberately does not run workflows from token
# pushes. So this is driven two ways, both passing the tag explicitly:
#   - called by release-please.yml the moment it cuts a release, and
#   - dispatched by hand to (re)publish a specific tag.
on:
  workflow_call:
    inputs:
      tag:
        description: Tag to publish, e.g. v0.6.0
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish, e.g. v0.6.0
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  image:
    name: Publish image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          # Derive the tags from the input rather than the git ref, since this
          # workflow is not triggered by a tag push.
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag }}
            type=raw,value=latest
      # arm64 alongside amd64: plenty of cheap servers and home machines are
      # ARM, and an image that excludes them excludes a real share of the
      # people this project is for.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ inputs.tag }}

  binaries:
    name: Publish binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - uses: goreleaser/goreleaser-action@v6
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
